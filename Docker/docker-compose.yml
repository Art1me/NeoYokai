services:
  postgres:
    image: postgres:16-alpine
    container_name: neoyokai_db
    environment:
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: neoyokai_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
